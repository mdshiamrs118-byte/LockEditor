plugins { id 'com.android.application' }

android {
    namespace 'com.lockeditor.rs118'
    compileSdk 34
    defaultConfig {
        applicationId 'com.lockeditor.rs118'
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName '0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    // Xposed API stubs: compile-time only, real classes are provided by LSPosed at runtime
    compileOnly project(':xposedstub')
}
